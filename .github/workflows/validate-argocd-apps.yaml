name: Validate ArgoCD apps

# ArgoCD auto-syncs argocd-apps/stack/ straight onto the live cluster on every
# push to main. There is no manual gate after merge, so this PR check is the
# only thing standing between a broken manifest and production.
on:
  pull_request:
    paths:
      - 'argocd-apps/**'
      - '.github/workflows/validate-argocd-apps.yaml'
      - '.github/scripts/validate_argocd_apps.py'
  # Also run on main so a direct push (bypassing PR) is still reported on.
  push:
    branches: [main]
    paths:
      - 'argocd-apps/**'
      - '.github/workflows/validate-argocd-apps.yaml'
      - '.github/scripts/validate_argocd_apps.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: helm template --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          # Must match the Helm that ArgoCD's repo-server actually renders with,
          # or this job can pass on a chart that then fails to sync. Check with:
          #   kubectl exec -n argocd deploy/argocd-repo-server -- helm version
          # ArgoCD v3.5.0 ships Helm v4.2.1. (Was v3.16.4 for ArgoCD v2.13.2 —
          # bump this whenever you upgrade ArgoCD.)
          version: v4.2.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Render every Application through helm template
        run: python3 .github/scripts/validate_argocd_apps.py argocd-apps
