---
# Loki log store, single-binary mode — right-sized for a 3-node homelab.
# GOTCHA 3: chart is `loki` (Grafana Labs' current chart), NOT `loki-stack`.
# loki-stack is deprecated and pins Loki 2.6.1, which fails Grafana's
# datasource health-check query.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    # Wave 1: must be up and accepting pushes before Alloy (wave 2) starts.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.18.0
    helm:
      releaseName: loki
      values: |
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          # Without retention Loki never deletes anything. The PVC is 10Gi, so
          # it just fills and then ingestion stops — a slow-fuse outage.
          limits_config:
            retention_period: 168h   # 7d, matching Prometheus
          compactor:
            working_directory: /var/loki/compactor
            # retention_enabled is what actually makes the compactor delete
            # expired chunks; retention_period alone only marks them.
            retention_enabled: true
            # Required by Loki 3.x whenever retention_enabled is true.
            delete_request_store: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
        singleBinary:
          replicas: 1
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi

        # GOTCHA 2: chunksCache and resultsCache are memcached subcharts that
        # request ~9.6GB of memory between them by default. That will never
        # schedule on a 4GB node — both must be off.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        # SingleBinary mode: the scalable-mode components must be zeroed out.
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        # lokiCanary is TOP-LEVEL in chart 6.x. The old Terraform module nested
        # it under `monitoring:`, where it was silently ignored — which is why
        # three loki-canary pods were running despite being "disabled".
        lokiCanary:
          enabled: false
        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
        test:
          enabled: false
        gateway:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
