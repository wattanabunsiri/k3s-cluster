---
# Registers Loki as a Grafana datasource.
#
# This is a plain ConfigMap, not an Application — the root app applies it
# directly. Grafana's sidecar watches for ConfigMaps labelled
# `grafana_datasource: "1"` in its own namespace and loads them at runtime,
# so no Grafana restart is needed.
#
# Wave 3 so it lands only after the `monitoring` namespace exists (created by
# the monitoring app in wave 0) and Loki is actually serving (wave 1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  # Must be Grafana's namespace, not `logging` — the sidecar only watches here.
  namespace: monitoring
  labels:
    grafana_datasource: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: false
        editable: true
