---
# kube-prometheus-stack: Prometheus + Grafana + Alertmanager + exporters.
# Chart 65.5.1 is pinned deliberately — known-good on this cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # Wave 0: this creates the `monitoring` namespace that later waves depend on.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.1
    helm:
      releaseName: monitoring
      values: |
        grafana:
          # GOTCHA 1: Grafana's image is Alpine/musl. musl's resolver walks the
          # full ndots:5 search path and intermittently returns "no such host"
          # for cluster-internal names. ndots:2 fixes it.
          # This is `grafana.dnsConfig`, NOT `grafana.podDnsConfig` — the latter
          # is not in this chart's schema and is silently ignored.
          dnsPolicy: ClusterFirst
          dnsConfig:
            options:
              - name: ndots
                value: "2"
          # Admin password comes from a pre-created Secret, never from Git.
          # See argocd-apps/README.md for the one-time creation command.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          service:
            type: ClusterIP
          # Without this Grafana runs on emptyDir: anything created through the
          # UI (dashboards, users, preferences, API keys) is lost on restart.
          # Provisioned datasources survive regardless — they come from the
          # sidecar ConfigMaps — but nothing you click is durable without a PVC.
          persistence:
            enabled: true
            type: pvc
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            size: 2Gi
          # Must be Recreate once persistence is on. The chart defaults to
          # RollingUpdate, which stands up the new pod before retiring the old
          # one — but a ReadWriteOnce local-path volume can only be attached on
          # one node, so the replacement hangs Pending on "volume already
          # attached" and the rollout never finishes.
          deploymentStrategy:
            type: Recreate
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
          sidecar:
            datasources:
              enabled: true
              label: grafana_datasource
              labelValue: "1"

        prometheus:
          prometheusSpec:
            retention: 7d
            # `retention: 7d` is meaningless on emptyDir, which is the chart
            # default — every pod restart starts the history from zero. This
            # cluster's previous Prometheus racked up 59 OOM restarts, so that
            # was not hypothetical.
            #
            # local-path is WaitForFirstConsumer: the PV is created on whichever
            # node the pod first lands on and pins Prometheus there afterwards.
            # Acceptable for a homelab; it does mean Prometheus won't reschedule
            # if that node dies.
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi
            resources:
              requests:
                memory: 300Mi
                cpu: 100m
              limits:
                # Raised from the old Terraform module's 700Mi: that pod had
                # racked up 59 OOM restarts before this migration.
                memory: 1Gi

        alertmanager:
          enabled: true
          alertmanagerSpec:
            # Routing lives in the `discord` AlertmanagerConfig CR
            # (stack/alertmanager-config.yaml), NOT in an inline `config:` block
            # here.
            #
            # GOTCHA 5 (extended): Discord needs `discord_configs` +
            # `webhook_url`. Alertmanager itself also accepts
            # `webhook_url_file`, but prometheus-operator v0.77.2 validates the
            # inline config first and its Discord parser only knows
            # `webhook_url` — it fails with "no discord webhook URL provided"
            # and never creates the StatefulSet. Naming a CR here sidesteps
            # that: the CR references the Secret by key, so the webhook stays
            # out of Git.
            alertmanagerConfiguration:
              name: discord
            resources:
              requests:
                memory: 64Mi
              limits:
                memory: 128Mi

        # ── k3s control-plane scrape jobs: all disabled ──────────────
        # k3s runs the scheduler, controller-manager and kube-proxy inside the
        # single `k3s server` process, not as standalone pods. Each does export
        # metrics, but bound to 127.0.0.1 (:10259, :10257, :10249), so a
        # Prometheus pod on another node can never reach them. Left enabled
        # they produce permanently-down targets and fire KubeSchedulerDown /
        # KubeControllerManagerDown / KubeProxyDown as critical alerts forever.
        #
        # Disabling each also removes its alert rule group, not just the
        # ServiceMonitor.
        #
        # To collect these for real instead, add to the k3s server unit:
        #   --kube-scheduler-arg=bind-address=0.0.0.0
        #   --kube-controller-manager-arg=bind-address=0.0.0.0
        #   --kube-proxy-arg=metrics-bind-address=0.0.0.0
        # then re-enable below and point .endpoints at the master IP. That
        # exposes the metrics on the LAN and needs a k3s restart.
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
        # This cluster's datastore is sqlite (/var/lib/rancher/k3s/server/db/
        # state.db) — there is no etcd at all, and nothing on :2381.
        kubeEtcd:
          enabled: false

        kube-state-metrics:
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi

        prometheus-node-exporter:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi

        prometheusOperator:
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Required to manage the CRDs: the largest (prometheuses) is 777KB, well
      # over the 256KB last-applied-configuration annotation that client-side
      # apply uses, so without this the sync fails "metadata.annotations: Too
      # long".
      #
      # This was previously impossible: ArgoCD v2.13.2 predated k8s v1.36 and
      # its structured-merge-diff died on
      #   .status.terminatingReplicas: field not declared in schema
      # wedging the app at sync status Unknown. Fixed by upgrading ArgoCD to
      # v3.5.0 — do not re-enable on an older ArgoCD.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
