---
# kube-prometheus-stack: Prometheus + Grafana + Alertmanager + exporters.
# Chart 65.5.1 is pinned deliberately — known-good on this cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # Wave 0: this creates the `monitoring` namespace that later waves depend on.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.1
    helm:
      releaseName: monitoring
      values: |
        grafana:
          # GOTCHA 1: Grafana's image is Alpine/musl. musl's resolver walks the
          # full ndots:5 search path and intermittently returns "no such host"
          # for cluster-internal names. ndots:2 fixes it.
          # This is `grafana.dnsConfig`, NOT `grafana.podDnsConfig` — the latter
          # is not in this chart's schema and is silently ignored.
          dnsPolicy: ClusterFirst
          dnsConfig:
            options:
              - name: ndots
                value: "2"
          # Admin password comes from a pre-created Secret, never from Git.
          # See argocd-apps/README.md for the one-time creation command.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          service:
            type: ClusterIP
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
          sidecar:
            datasources:
              enabled: true
              label: grafana_datasource
              labelValue: "1"

        prometheus:
          prometheusSpec:
            retention: 7d
            resources:
              requests:
                memory: 300Mi
                cpu: 100m
              limits:
                # Raised from the old Terraform module's 700Mi: that pod had
                # racked up 59 OOM restarts before this migration.
                memory: 1Gi

        alertmanager:
          enabled: true
          alertmanagerSpec:
            # Routing lives in the `discord` AlertmanagerConfig CR
            # (stack/alertmanager-config.yaml), NOT in an inline `config:` block
            # here.
            #
            # GOTCHA 5 (extended): Discord needs `discord_configs` +
            # `webhook_url`. Alertmanager itself also accepts
            # `webhook_url_file`, but prometheus-operator v0.77.2 validates the
            # inline config first and its Discord parser only knows
            # `webhook_url` — it fails with "no discord webhook URL provided"
            # and never creates the StatefulSet. Naming a CR here sidesteps
            # that: the CR references the Secret by key, so the webhook stays
            # out of Git.
            alertmanagerConfiguration:
              name: discord
            resources:
              requests:
                memory: 64Mi
              limits:
                memory: 128Mi

        kube-state-metrics:
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi

        prometheus-node-exporter:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi

        prometheusOperator:
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Required. The monitoring.coreos.com CRDs are far larger than the 256KB
      # last-applied-configuration annotation that client-side apply uses;
      # without this the sync fails with "metadata.annotations: Too long".
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
